{% extends "base.html" %}

{% block title %}Image Gallery | PIXELMIND{% endblock %}

{% block content %}
<div class="space-y-6">
  <!-- Header Title -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-extrabold text-[#111111] tracking-tight">Visual Intelligence Gallery</h1>
      <p class="text-sm text-gray-500 mt-1">Browse, filter, and inspect photographs, detected object classes, and visual DNA.</p>
    </div>
    <a href="/upload" class="inline-flex items-center space-x-2 px-4 py-2 bg-[#C62828] text-white rounded-lg text-sm font-semibold hover:bg-red-700 transition shadow-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span>Upload Images</span>
    </a>
  </div>

  <!-- Filter & Search Bar -->
  <form id="filterForm" class="bg-white rounded-xl border border-[#E5E5E5] p-4 shadow-sm grid grid-cols-1 sm:grid-cols-3 gap-3">
    <!-- Category Filter -->
    <div>
      <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1">Category</label>
      <select 
        name="category"
        hx-get="/partials/gallery-grid"
        hx-target="#galleryGrid"
        hx-include="#filterForm"
        class="w-full text-xs font-medium rounded-lg border border-gray-300 px-3 py-2 bg-gray-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#C62828]"
      >
        <option value="all">All Categories</option>
        {% for cat in categories %}
          <option value="{{ cat }}" {% if category_filter == cat %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Environment Filter -->
    <div>
      <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1">Environment</label>
      <select 
        name="environment"
        hx-get="/partials/gallery-grid"
        hx-target="#galleryGrid"
        hx-include="#filterForm"
        class="w-full text-xs font-medium rounded-lg border border-gray-300 px-3 py-2 bg-gray-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#C62828]"
      >
        <option value="all">All Environments</option>
        <option value="outdoor" {% if env_filter == 'outdoor' %}selected{% endif %}>Outdoor</option>
        <option value="indoor" {% if env_filter == 'indoor' %}selected{% endif %}>Indoor</option>
      </select>
    </div>

    <!-- Search input -->
    <div>
      <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1">Filter by Label or Keyword</label>
      <div class="relative">
        <input 
          type="text" 
          name="search"
          placeholder="e.g. car, person, office..."
          value="{{ search_query }}"
          hx-get="/partials/gallery-grid"
          hx-trigger="keyup changed delay:300ms"
          hx-target="#galleryGrid"
          hx-include="#filterForm"
          class="w-full text-xs font-medium rounded-lg border border-gray-300 pl-8 pr-3 py-2 bg-gray-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#C62828]"
        >
        <svg class="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
    </div>
  </form>

  <!-- Gallery Grid Container -->
  <div id="galleryGrid">
    {% include "partials/gallery_grid.html" %}
  </div>
</div>
{% endblock %}
